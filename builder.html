<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build your site — Hive Sites</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  input[type=color] { -webkit-appearance: none; border: none; width: 40px; height: 40px; padding: 0; border-radius: 8px; overflow: hidden; }
  input[type=color]::-webkit-color-swatch { border: none; border-radius: 8px; }
</style>
</head>
<body class="bg-slate-50 text-slate-900">

<nav class="flex items-center justify-between px-6 py-4 border-b border-slate-200 bg-white">
  <a href="index.html" class="flex items-center gap-2 font-bold text-lg">🐝 Hive Sites</a>
  <p class="text-sm text-slate-500">Live preview — nothing is saved or published yet</p>
</nav>

<div class="grid md:grid-cols-2 min-h-[calc(100vh-65px)]">

  <!-- FORM -->
  <div class="p-6 md:p-10 overflow-y-auto max-h-[calc(100vh-65px)]">
    <h1 class="text-2xl font-bold mb-1">Tell us about your business</h1>
    <p class="text-slate-500 text-sm mb-6">Your preview updates instantly on the right as you type.</p>

    <form id="intakeForm" class="space-y-5">

      <div>
        <label class="block text-sm font-semibold mb-1">Business name</label>
        <input id="businessName" type="text" placeholder="e.g. Sunset Coffee Roasters" class="w-full border border-slate-300 rounded-lg px-3 py-2" value="Sunset Coffee Roasters">
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1">Industry</label>
        <select id="industry" class="w-full border border-slate-300 rounded-lg px-3 py-2">
          <option>Restaurant / Café</option>
          <option>Salon / Spa</option>
          <option>Contractor / Trades</option>
          <option>Retail Shop</option>
          <option>Professional Services</option>
          <option>Fitness / Wellness</option>
          <option>Other</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1">Tagline</label>
        <input id="tagline" type="text" placeholder="e.g. Small-batch coffee, roasted daily" class="w-full border border-slate-300 rounded-lg px-3 py-2" value="Small-batch coffee, roasted daily">
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1">About your business</label>
        <textarea id="about" rows="3" class="w-full border border-slate-300 rounded-lg px-3 py-2" placeholder="What do you do, who do you serve, what makes you different?">We've been roasting small-batch coffee in the neighborhood since 2015. Every bag is roasted fresh to order using beans sourced directly from family farms.</textarea>
        <button type="button" id="polishBtn" class="mt-2 text-xs font-semibold text-amber-700 bg-amber-50 border border-amber-200 rounded-full px-3 py-1 hover:bg-amber-100">✨ Polish my copy (AI, demo)</button>
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1">Services / products (comma separated)</label>
        <input id="services" type="text" class="w-full border border-slate-300 rounded-lg px-3 py-2" value="Espresso &amp; drip coffee, Whole-bean bags, Cold brew on tap, Coffee subscriptions">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold mb-1">Phone</label>
          <input id="phone" type="text" class="w-full border border-slate-300 rounded-lg px-3 py-2" value="(555) 018-2043">
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">Email</label>
          <input id="email" type="text" class="w-full border border-slate-300 rounded-lg px-3 py-2" value="hello@sunsetcoffee.example">
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1">Address</label>
        <input id="address" type="text" class="w-full border border-slate-300 rounded-lg px-3 py-2" value="412 Harbor St, Wilmington, NC">
      </div>

      <div class="flex items-center gap-4">
        <div>
          <label class="block text-sm font-semibold mb-1">Brand color</label>
          <input id="color" type="color" value="#f59e0b">
        </div>
        <div class="flex-1">
          <label class="block text-sm font-semibold mb-1">Template</label>
          <div class="flex gap-2">
            <button type="button" data-template="modern" class="tpl-btn flex-1 border-2 border-amber-500 rounded-lg py-2 text-sm font-semibold">Modern</button>
            <button type="button" data-template="classic" class="tpl-btn flex-1 border border-slate-300 rounded-lg py-2 text-sm font-semibold">Classic</button>
            <button type="button" data-template="bold" class="tpl-btn flex-1 border border-slate-300 rounded-lg py-2 text-sm font-semibold">Bold</button>
          </div>
        </div>
      </div>

    </form>

    <div class="mt-8 bg-white border border-slate-200 rounded-xl p-5">
      <p class="font-semibold text-sm mb-1">Like what you see?</p>
      <p class="text-sm text-slate-500 mb-3">In the real product this is where you'd approve the design and start your subscription. This demo doesn't take payment yet.</p>
      <button type="button" class="bg-amber-500 text-white text-sm font-semibold px-4 py-2 rounded-lg opacity-60 cursor-not-allowed" disabled>Publish my site — coming soon</button>
    </div>
  </div>

  <!-- PREVIEW -->
  <div class="bg-slate-200 p-4 md:p-8 flex items-start justify-center">
    <div class="w-full max-w-2xl bg-white rounded-xl shadow-xl overflow-hidden border border-slate-300">
      <div class="bg-slate-100 px-4 py-2 flex items-center gap-1.5 border-b border-slate-200">
        <span class="w-3 h-3 rounded-full bg-red-400"></span>
        <span class="w-3 h-3 rounded-full bg-amber-400"></span>
        <span class="w-3 h-3 rounded-full bg-green-400"></span>
      </div>
      <iframe id="previewFrame" class="w-full" style="height: 75vh; border: 0;"></iframe>
    </div>
  </div>

</div>

<script src="site-template.js"></script>
<script>
  const form = document.getElementById('intakeForm');
  const frame = document.getElementById('previewFrame');
  let currentTemplate = 'modern';

  document.querySelectorAll('.tpl-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentTemplate = btn.dataset.template;
      document.querySelectorAll('.tpl-btn').forEach(b => {
        b.classList.remove('border-2', 'border-amber-500');
        b.classList.add('border', 'border-slate-300');
      });
      btn.classList.remove('border', 'border-slate-300');
      btn.classList.add('border-2', 'border-amber-500');
      render();
    });
  });

  document.getElementById('polishBtn').addEventListener('click', () => {
    const el = document.getElementById('about');
    el.value = polishCopy(el.value);
    render();
  });

  function polishCopy(text) {
    const trimmed = text.trim().replace(/\s+/g, ' ');
    if (!trimmed) return trimmed;
    const opener = "Here's what sets us apart: ";
    const closer = " We'd love to welcome you in.";
    return opener + trimmed.charAt(0).toLowerCase() + trimmed.slice(1) + closer;
  }

  function getData() {
    return {
      businessName: document.getElementById('businessName').value || 'Your Business Name',
      industry: document.getElementById('industry').value,
      tagline: document.getElementById('tagline').value,
      about: document.getElementById('about').value,
      services: document.getElementById('services').value.split(',').map(s => s.trim()).filter(Boolean),
      phone: document.getElementById('phone').value,
      email: document.getElementById('email').value,
      address: document.getElementById('address').value,
      color: document.getElementById('color').value,
      template: currentTemplate
    };
  }

  function render() {
    const data = getData();
    frame.srcdoc = renderSite(data);
  }

  form.addEventListener('input', render);
  render();
</script>

</body>
</html>
